name: Synchronize package lock

on:
  push:
    branches:
      - fix/integrated-system-full-remediation
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: "!startsWith(github.event.head_commit.message, 'chore(ci): synchronize package lock')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): synchronize package lock"
          git push origin HEAD:${{ github.ref_name }}
