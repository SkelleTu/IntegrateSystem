name: AuraPrinter Windows build

on:
  push:
    branches: [fix/aura-system-hardening-qa]
    paths:
      - "attached_assets/windows_app/AuraPrinter/**"
      - ".github/workflows/windows-printer-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish AuraPrinter
        run: dotnet publish attached_assets/windows_app/AuraPrinter/AuraPrinter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/AuraPrinter
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AuraPrinter-win-x64
          path: artifacts/AuraPrinter/
          if-no-files-found: error
          retention-days: 14
