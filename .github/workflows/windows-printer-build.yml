name: AuraPrinter Windows build

on:
  push:
    branches: [fix/aura-system-hardening-qa]
    paths:
      - "attached_assets/windows_app/AuraPrinter/**"
      - ".github/workflows/windows-printer-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Aura System dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Build Aura System Electron desktop app
        run: npm run build:electron
      - name: Publish AuraPrinter
        run: dotnet publish attached_assets/windows_app/AuraPrinter/AuraPrinter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/AuraPrinter
      - name: Include secure launcher
        shell: pwsh
        run: |
          Copy-Item "attached_assets/windows_app/AuraPrinter/Iniciar AuraPrinter.bat" "artifacts/AuraPrinter/Iniciar AuraPrinter.bat"
          Copy-Item "attached_assets/windows_app/AuraPrinter/Iniciar AuraPrinter.ps1" "artifacts/AuraPrinter/Iniciar AuraPrinter.ps1"
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AuraPrinter-win-x64
          path: artifacts/AuraPrinter/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Aura System Electron desktop application
        uses: actions/upload-artifact@v4
        with:
          name: AuraSystem-Electron-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
