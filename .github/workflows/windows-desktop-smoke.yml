name: Windows desktop runtime smoke

on:
  workflow_run:
    workflows: ["Aura Observability Hardening"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  windows-runtime-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'fix/update-electron-desktop-toolchain' }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Download portable Windows executable
        uses: actions/download-artifact@v4
        with:
          name: aura-system-windows-portable
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Launch packaged app and verify local backend
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path artifact -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable Aura System executable was not found.' }

          $env:AURA_AUTOTEST = '1'
          $env:AURA_PORT = '5119'
          $env:SESSION_SECRET = 'ci-only-aura-windows-smoke-session-secret'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--disable-gpu' -PassThru
          $healthy = $false
          try {
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5119/health' -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.service -eq 'integrated-system') {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }

            if (-not $healthy) { throw 'Packaged Windows app did not start its local backend.' }

            $db = Invoke-RestMethod -Uri 'http://127.0.0.1:5119/api/db/status' -TimeoutSec 5
            if ($db.provider -ne 'sqlite-local') { throw "Expected isolated SQLite, got $($db.provider)." }

            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:5119/' -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'id="root"') {
              throw 'Packaged SPA did not serve the application shell.'
            }

            Write-Host 'Windows portable executable: backend, SQLite and SPA startup passed.'
          } finally {
            Get-Process -Name 'Aura System' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }
