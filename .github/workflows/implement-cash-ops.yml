                  <DialogContent className="w-[calc(100vw-1rem)] sm:max-w-2xl max-h-[90vh] overflow-y-auto bg-zinc-950 border-white/10 text-white rounded-2xl p-4 sm:p-6">
                    <DialogHeader>
