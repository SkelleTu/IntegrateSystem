    const closingAmount = Math.round(Number(req.body.closingAmount) * 100);
    const updated = await storage.closeCashRegister(register.id, closingAmount);''',
              '''    const closingAmountReais = Number(String(req.body.closingAmount ?? "").replace(",", "."));
    if (!Number.isFinite(closingAmountReais) || closingAmountReais < 0) {
      return res.status(400).json({ message: "Valor de fechamento inválido" });
    }
    const closingAmount = Math.round(closingAmountReais * 100);
    const updated = await storage.closeCashRegister(register.id, closingAmount);'''
          )

          # ------------------------------------------------------------------
          # New responsive UI component inside the cart card
          # ------------------------------------------------------------------
          component = r'''import { useState } from "react";
          import { useLocation } from "wouter";
          import { useMutation, useQuery } from "@tanstack/react-query";
          import type { CashRegister } from "@shared/schema";
          import { apiRequest, queryClient } from "@/lib/queryClient";
          import { Button } from "@/components/ui/button";
          import { Input } from "@/components/ui/input";
          import { Dialog, DialogContent, DialogFooter, DialogHeader, DialogTitle } from "@/components/ui/dialog";
          import { useToast } from "@/hooks/use-toast";
          import { BanknoteArrowDown, BanknoteArrowUp, ClipboardCheck, LockKeyhole, Settings2, WalletCards } from "lucide-react";

          type Action = "opening" | "closing" | "withdrawal" | "replenishment" | null;

          export default function CashRegisterOptions({ register }: { register: CashRegister | null }) {
            const [, setLocation] = useLocation();
            const { toast } = useToast();
            const [open, setOpen] = useState(false);
            const [action, setAction] = useState<Action>(null);
            const [amount, setAmount] = useState("");
            const [reason, setReason] = useState("");

            const { data: summary } = useQuery<any>({
              queryKey: ["/api/cash-register/summary"],
              enabled: open && !!register,
              staleTime: 1000,
              refetchOnWindowFocus: false,
            });

            const movementMutation = useMutation({
              mutationFn: async ({ type, amount, reason }: { type: "withdrawal" | "replenishment"; amount: string; reason: string }) => {
                const res = await apiRequest("POST", "/api/cash-register/movement", { type, amount, reason });
                return res.json();
              },
              onSuccess: () => {
                queryClient.invalidateQueries({ queryKey: ["/api/cash-register/summary"] });
                queryClient.invalidateQueries({ queryKey: ["/api/cash-register/open"] });
                queryClient.invalidateQueries({ queryKey: ["/api/cash-registers/history"] });
                setAmount("");
