                setAction(null);
                toast({ title: action === "withdrawal" ? "Sangria registrada" : "Reposição registrada" });
              },
              onError: (error: any) => {
                toast({ title: "Movimentação não registrada", description: error?.message || "Verifique os dados e tente novamente", variant: "destructive" });
              },
            });

            const openAction = (next: Action) => {
              setAction(next);
              setAmount("");
              setReason("");
            };

            const submitMovement = () => {
