              '''import { tickets, users, fiscalSettings, cashRegisterMovements, insertFiscalSettingsSchema, insertCashRegisterMovementSchema } from "../shared/schema";'''
          )
          anchor = '''  // Cashier API
  app.get("/api/cash-register/open", async (req, res) => {'''
          replacement = '''  // Cashier API — ledger financeiro do dinheiro físico
  async function calculateCashRegisterSummary(registerId: number) {
    const register = await db.select().from(cashRegisters).where(eq(cashRegisters.id, registerId)).limit(1);
    const currentRegister: any = register[0];
    if (!currentRegister) throw new Error("Caixa não encontrado");

    const salesList = await storage.getSalesByRegisterId(registerId);
    const completedSales = salesList.filter((sale: any) => sale.status === "completed");
    let cashSales = 0;
    for (const sale of completedSales) {
      const salePayments = await storage.getPayments(sale.id);
      cashSales += salePayments
        .filter((payment: any) => payment.method === "cash")
        .reduce((sum: number, payment: any) => sum + Number(payment.amount || 0), 0);
    }

    const movements = await db.select()
      .from(cashRegisterMovements)
      .where(eq(cashRegisterMovements.cashRegisterId, registerId))
      .orderBy(desc(cashRegisterMovements.createdAt));

    const replenishments = movements
      .filter((m: any) => m.type === "replenishment")
      .reduce((sum: number, m: any) => sum + Number(m.amount || 0), 0);
    const withdrawals = movements
      .filter((m: any) => m.type === "withdrawal")
      .reduce((sum: number, m: any) => sum + Number(m.amount || 0), 0);
    const adjustments = movements
      .filter((m: any) => m.type === "adjustment")
      .reduce((sum: number, m: any) => sum + Number(m.amount || 0), 0);
    const expectedAmount = (currentRegister.openingAmount || 0) + cashSales + replenishments - withdrawals + adjustments;

    return {
      register: currentRegister,
      openingAmount: currentRegister.openingAmount || 0,
      cashSales,
      replenishments,
      withdrawals,
      adjustments,
      expectedAmount,
      movements,
    };
  }

  app.get("/api/cash-register/summary", isAuthenticated, async (req, res) => {
    try {
      const user = req.user as any;
      const register = await storage.getOpenCashRegister(user.id);
      if (!register) return res.status(404).json({ message: "No open register" });
      const summary = await calculateCashRegisterSummary(register.id);
      res.json(summary);
    } catch (err: any) {
      console.error("Erro ao calcular saldo do caixa:", err);
      res.status(500).json({ message: err.message || "Erro ao calcular saldo do caixa" });
    }
  });

  app.post("/api/cash-register/movement", isAuthenticated, async (req, res) => {
    try {
      const user = req.user as any;
      const register = await storage.getOpenCashRegister(user.id);
      if (!register) return res.status(400).json({ message: "Abra o caixa antes de registrar movimentações" });

      const type = String(req.body.type || "");
      if (!["replenishment", "withdrawal"].includes(type)) {
        return res.status(400).json({ message: "Tipo de movimentação inválido" });
      }

      const amount = Math.round(Number(String(req.body.amount ?? "").replace(",", ".")) * 100);
      if (!Number.isFinite(amount) || amount <= 0) {
        return res.status(400).json({ message: "O valor deve ser maior que zero" });
      }

      const reason = String(req.body.reason || "").trim();
      if (!reason) return res.status(400).json({ message: "Informe o motivo da movimentação" });

      if (type === "withdrawal") {
        const summary = await calculateCashRegisterSummary(register.id);
        if (amount > summary.expectedAmount) {
          return res.status(400).json({
            message: `Sangria superior ao dinheiro disponível. Disponível: R$ ${(summary.expectedAmount / 100).toFixed(2)}`
          });
        }
      }

      const parsed = insertCashRegisterMovementSchema.parse({
        cashRegisterId: register.id,
        userId: user.id,
        type,
        amount,
        reason,
        createdAt: new Date(),
      });

      const [movement] = await db.insert(cashRegisterMovements).values(parsed as any).returning();
      res.status(201).json(movement);
    } catch (err: any) {
      console.error("Erro ao registrar movimentação do caixa:", err);
      res.status(400).json({ message: err.message || "Erro ao registrar movimentação do caixa" });
    }
  });

  app.get("/api/cash-register/open", async (req, res) => {'''
          replace_once('server/routes.ts', anchor, replacement)

          # Update opening route to reject malformed amounts and record opening through storage.
          replace_once(
              'server/routes.ts',
              '''    const data = insertCashRegisterSchema.parse({
      ...req.body,
      userId: user.id,
      status: "open",
      openedAt: new Date()
    });''',
              '''    const openingAmount = Number(String(req.body.openingAmount ?? 0).replace(",", "."));
    if (!Number.isFinite(openingAmount) || openingAmount < 0) {
      return res.status(400).json({ message: "Valor de abertura inválido" });
    }

    const data = insertCashRegisterSchema.parse({
      ...req.body,
