                              <div className="min-w-0"><p className="text-[9px] font-black uppercase truncate">{movement.type}</p><p className="text-[8px] text-white/30 truncate">{movement.reason || "Sem motivo"}</p></div>
                              <span className="text-[10px] font-black">R$ {(movement.amount / 100).toFixed(2)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </DialogContent>
                </Dialog>
              </>
            );
          }
          '''
          (root / 'client/src/components/CashRegisterOptions.tsx').write_text(component)

          # ------------------------------------------------------------------
