name: Implement forensic cash operations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-cash-ops.yml

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[cash-ops]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # shared/schema.ts: audited cash movement ledger
          # ------------------------------------------------------------------
          replace_once(
              'shared/schema.ts',
              '''export const sales = pgTable("sales", {''',
              '''export const cashRegisterMovements = pgTable("cash_register_movements", {
            id: integer("id").primaryKey({ autoIncrement: true }),
            cashRegisterId: integer("cash_register_id").notNull(),
            userId: integer("user_id").notNull(),
            type: text("type").notNull(), // opening, replenishment, withdrawal, adjustment, closing
            amount: integer("amount").notNull(), // cents; adjustment may be negative
            reason: text("reason"),
            createdAt: integer("created_at", { mode: 'timestamp' }).notNull().$defaultFn(() => new Date()),
          });

          export const sales = pgTable("sales", {'''
          )
          replace_once(
              'shared/schema.ts',
              '''export const insertSaleSchema = createInsertSchema(sales);''',
              '''export const insertCashRegisterMovementSchema = createInsertSchema(cashRegisterMovements, {
            amount: z.number(),
          });
          export const insertSaleSchema = createInsertSchema(sales);'''
          )
          replace_once(
              'shared/schema.ts',
              '''export type CashRegister = typeof cashRegisters.$inferSelect;''',
              '''export type CashRegister = typeof cashRegisters.$inferSelect;
          export type CashRegisterMovement = typeof cashRegisterMovements.$inferSelect;'''
          )
          replace_once(
              'shared/schema.ts',
              '''export type InsertCashRegister = z.infer<typeof insertCashRegisterSchema>;''',
              '''export type InsertCashRegister = z.infer<typeof insertCashRegisterSchema>;
          export type InsertCashRegisterMovement = z.infer<typeof insertCashRegisterMovementSchema>;'''
          )

          # ------------------------------------------------------------------
          # server/db.ts: local + Turso schema creation
          # ------------------------------------------------------------------
          replace_once(
              'server/db.ts',
              '''  `CREATE TABLE IF NOT EXISTS sales (''',
              '''  `CREATE TABLE IF NOT EXISTS cash_register_movements (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            cash_register_id INTEGER NOT NULL,
            user_id INTEGER NOT NULL,
            type TEXT NOT NULL,
            amount INTEGER NOT NULL,
            reason TEXT,
            created_at INTEGER NOT NULL
          )`,
          `CREATE TABLE IF NOT EXISTS sales ('''
          )
          replace_once(
              'server/db.ts',
              '''      `CREATE TABLE IF NOT EXISTS batches (''',
              '''      `CREATE TABLE IF NOT EXISTS cash_register_movements (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            cash_register_id INTEGER NOT NULL,
            user_id INTEGER NOT NULL,
            type TEXT NOT NULL,
            amount INTEGER NOT NULL,
            reason TEXT,
            created_at INTEGER NOT NULL
          )`,
      `CREATE TABLE IF NOT EXISTS batches ('''
          )

          # ------------------------------------------------------------------
          # server/storage.ts: opening and closing are ledger-aware
          # ------------------------------------------------------------------
          replace_once(
              'server/storage.ts',
              '''  cashRegisters, sales, saleItems, payments, transactions,''',
              '''  cashRegisters, cashRegisterMovements, sales, saleItems, payments, transactions,'''
          )
          replace_once(
              'server/storage.ts',
              '''      if (newRegister.openingAmount && newRegister.openingAmount > 0) {
        await database.insert(transactions).values({''',
              '''      await database.insert(cashRegisterMovements).values({
        cashRegisterId: newRegister.id,
        userId: newRegister.userId,
        type: "opening",
        amount: newRegister.openingAmount || 0,
        reason: "Abertura de Caixa",
        createdAt: new Date(),
      } as any);

      if (newRegister.openingAmount && newRegister.openingAmount > 0) {
        await database.insert(transactions).values({'''
          )
          old_close = '''  async closeCashRegister(id: number, closingAmount: number): Promise<CashRegister> {
    this.logAction(`Fechamento de caixa ID:${id}`);
    return await dualWrite(async (database) => {
      const [register] = await database.select().from(cashRegisters).where(eq(cashRegisters.id, id));
      if (!register) throw new Error("Caixa não encontrado");

      const salesList = await database.select().from(sales).where(eq(sales.cashRegisterId, id));
      const completedSales = salesList.filter((s: any) => s.status === "completed");
      const cashPayments = await Promise.all(
        completedSales.map(async (sale: any) => {
          const salePayments = await database
            .select()
            .from(payments)
            .where(and(eq(payments.saleId, sale.id), eq(payments.method, "cash")));
          return salePayments.reduce((sum: number, payment: any) => sum + Number(payment.amount || 0), 0);
        })
      );
      const totalCashSales = cashPayments.reduce((sum, amount) => sum + amount, 0);
      const expectedAmount = (register.openingAmount || 0) + totalCashSales;
      const difference = closingAmount - expectedAmount;

      const [updated] = await database.update(cashRegisters)
        .set({ 
          closingAmount,
          difference,
          closedAt: new Date(),
          status: "closed"
        })
        .where(eq(cashRegisters.id, id))
        .returning();

      await database.insert(transactions).values({
        businessType: "padaria",
        type: "income",
        category: "caixa",
        description: `Fechamento de Caixa #${id} - Valor em Gaveta`,
        amount: closingAmount,
        createdAt: new Date()
      } as any);

      return updated;
    });
  }'''
          new_close = '''  async closeCashRegister(id: number, closingAmount: number): Promise<CashRegister> {
    this.logAction(`Fechamento de caixa ID:${id}`);
    return await dualWrite(async (database) => {
      const [register] = await database.select().from(cashRegisters).where(eq(cashRegisters.id, id));
      if (!register) throw new Error("Caixa não encontrado");
      if (register.status === "closed" || register.closedAt) throw new Error("Caixa já está fechado");

      const salesList = await database.select().from(sales).where(eq(sales.cashRegisterId, id));
      const completedSales = salesList.filter((s: any) => s.status === "completed");
      const cashPayments = await Promise.all(
        completedSales.map(async (sale: any) => {
          const salePayments = await database
            .select()
            .from(payments)
            .where(and(eq(payments.saleId, sale.id), eq(payments.method, "cash")));
          return salePayments.reduce((sum: number, payment: any) => sum + Number(payment.amount || 0), 0);
        })
      );
      const totalCashSales = cashPayments.reduce((sum, amount) => sum + amount, 0);
      const movements = await database.select()
        .from(cashRegisterMovements)
        .where(eq(cashRegisterMovements.cashRegisterId, id));
      const replenishments = movements
        .filter((m: any) => m.type === "replenishment")
        .reduce((sum: number, m: any) => sum + Number(m.amount || 0), 0);
      const withdrawals = movements
        .filter((m: any) => m.type === "withdrawal")
        .reduce((sum: number, m: any) => sum + Number(m.amount || 0), 0);
      const adjustments = movements
        .filter((m: any) => m.type === "adjustment")
        .reduce((sum: number, m: any) => sum + Number(m.amount || 0), 0);
      const expectedAmount = (register.openingAmount || 0) + totalCashSales + replenishments - withdrawals + adjustments;
      const difference = closingAmount - expectedAmount;

      const [updated] = await database.update(cashRegisters)
        .set({
          closingAmount,
          difference,
          closedAt: new Date(),
          status: "closed"
        })
        .where(and(eq(cashRegisters.id, id), eq(cashRegisters.status, "open")))
        .returning();

      if (!updated) throw new Error("Não foi possível fechar o caixa. Ele pode ter sido fechado por outra operação.");

      await database.insert(cashRegisterMovements).values({
        cashRegisterId: id,
        userId: register.userId,
        type: "closing",
        amount: closingAmount,
        reason: "Fechamento de Caixa",
        createdAt: new Date(),
      } as any);

      await database.insert(transactions).values({
        businessType: "padaria",
        type: "income",
        category: "caixa",
        description: `Fechamento de Caixa #${id} - Valor em Gaveta`,
        amount: closingAmount,
        createdAt: new Date()
      } as any);

      return updated;
    });
  }'''
          replace_once('server/storage.ts', old_close, new_close)

          # ------------------------------------------------------------------
          # server/routes.ts: authoritative movement API + authoritative summary
          # ------------------------------------------------------------------
          replace_once(
              'server/routes.ts',
