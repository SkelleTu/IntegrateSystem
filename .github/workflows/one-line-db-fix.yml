name: One-shot database line fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[db-line-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct only the accidental schema change
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'server/db.ts';
          const text = fs.readFileSync(file, 'utf8');
          const oldBlock = `  \`CREATE TABLE IF NOT EXISTS inventory_restocks (\n    id INTEGER PRIMARY KEY AUTOINCREMENT,\n    inventory_id INTEGER NOT NULL,\n    quantity INTEGER NOT NULL,\n    unit TEXT NOT NULL,\n    items_per_unit INTEGER NOT NULL DEFAULT 1,\n    cost_price INTEGER NOT NULL DEFAULT 0,\n    expiry_date INTEGER NOT NULL,\n    created_at INTEGER NOT NULL\n  )\`,`;
          const newBlock = oldBlock.replace('expiry_date INTEGER NOT NULL,', 'expiry_date INTEGER,');
          const occurrences = text.split(oldBlock).length - 1;
          if (occurrences !== 1) throw new Error(`Bloco esperado encontrado ${occurrences} vezes; nenhuma alteração aplicada.`);
          fs.writeFileSync(file, text.replace(oldBlock, newBlock), 'utf8');
          NODE
      - name: Typecheck
        run: npm ci && npx tsc --noEmit
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/one-line-db-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts .github/workflows/one-line-db-fix.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix: restore nullable inventory restock expiry"
          git push origin main
