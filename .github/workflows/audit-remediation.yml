# Continue dependency remediation after the production audit reached zero findings.
name: Aura dependency remediation

on:
  push:
    branches: [fix/aura-system-hardening-qa]
    paths:
      - ".github/workflows/audit-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aura-system-hardening-qa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependency graph
        run: npm install --no-audit --no-fund
      - name: Remove unused vulnerable fiscal helpers
        run: npm uninstall nfe-signer zod-validation-error --no-fund
      - name: Upgrade patched production libraries
        run: npm install drizzle-orm@0.45.4 @hookform/resolvers@5.2.2 zod@4.6.6 --save --no-fund
      - name: Keep the CSS typography plugin in build-only dependencies
        run: npm install --save-dev @tailwindcss/typography@^0.5.20 --no-fund
      - name: Upgrade the Electron desktop toolchain
        run: npm install --save-dev @electron-forge/cli@8.0.1 @electron-forge/maker-deb@8.0.1 @electron-forge/maker-rpm@8.0.1 @electron-forge/maker-squirrel@8.0.1 @electron-forge/maker-zip@8.0.1 @electron-forge/plugin-auto-unpack-natives@8.0.1 @electron-forge/plugin-fuses@8.0.1 @electron/fuses@2.1.3 electron@45.3.0 --no-fund
      - name: Patch the remaining production AJV advisory
        run: npm install ajv@^8.18.0 --save --no-fund
      - name: Apply remaining non-breaking security fixes
        run: npm audit fix --no-fund || true
      - name: Report remaining vulnerabilities
        continue-on-error: true
        run: |
          npm audit --json > /tmp/aura-audit-after.json || true
          node -e 'const r=require("/tmp/aura-audit-after.json"); console.log(JSON.stringify({summary:r.metadata?.vulnerabilities,packages:Object.entries(r.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,isDirect:x.isDirect,range:x.range,fixAvailable:x.fixAvailable}))},null,2));'
      - name: Audit production dependencies separately
        continue-on-error: true
        run: |
          npm audit --omit=dev --json > /tmp/aura-prod-audit.json || true
          node -e 'const r=require("/tmp/aura-prod-audit.json"); console.log(JSON.stringify({summary:r.metadata?.vulnerabilities,packages:Object.entries(r.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,isDirect:x.isDirect,range:x.range,fixAvailable:x.fixAvailable,via:x.via,effects:x.effects}))},null,2));'
      - name: Typecheck and build after dependency updates
        run: |
          npm run check
          npm run build
      - name: Commit lockfile-only security updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes from non-breaking audit fixes."
            exit 0
          fi
          git commit -m "fix(deps): apply non-breaking npm audit remediations"
          git fetch origin fix/aura-system-hardening-qa
          git rebase origin/fix/aura-system-hardening-qa
          git push origin HEAD:fix/aura-system-hardening-qa
