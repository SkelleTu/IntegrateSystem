name: Aura Observability Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aura-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript + build + observability contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit synchronized lockfile
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(ci): synchronize package lock"
            git push
          fi
      - run: npm run check
      - run: npm run test:session-store
      - run: npm run test:neon-session-store
      - run: npm run build
      - name: Validate Electron entrypoints
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
      - name: Smoke test bundled Electron Node backend
        run: npm run test:electron-backend
      - name: Build Windows desktop package
        run: npm run build:electron
      - name: Publish Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: aura-system-windows-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/verify-db-schema.mjs
      - run: node scripts/verify-observability.mjs

  windows-runtime-smoke:
    name: Windows packaged runtime smoke
    needs: verify
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/update-electron-desktop-toolchain' }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download portable Windows executable
        uses: actions/download-artifact@v4
        with:
          name: aura-system-windows-portable
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Inspect and launch packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path artifact -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Portable Aura System executable was not found.' }

          $sevenZip = 'C:/Program Files/7-Zip/7z.exe'
          if (Test-Path $sevenZip) {
            $extractDir = Join-Path $env:RUNNER_TEMP 'aura-unpacked'
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            & $sevenZip x $exe.FullName "-o$extractDir" -y | Out-Host
            if ($LASTEXITCODE -eq 0) {
              $appManifest = Get-ChildItem -Path $extractDir -Filter package.json -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName.EndsWith('/resources/app') -or $_.DirectoryName.EndsWith('\resources\app') } | Select-Object -First 1
              if ($appManifest) {
                Write-Host 'Packaged app manifest:'
                Get-Content -Path $appManifest.FullName -Raw | Write-Host
                $appRoot = Split-Path $appManifest.FullName -Parent
                $requiredPaths = @(
                  [IO.Path]::Combine($appRoot, 'electron', 'main.cjs'),
                  [IO.Path]::Combine($appRoot, 'dist', 'index.js'),
                  [IO.Path]::Combine($appRoot, 'dist', 'node_modules', 'express', 'package.json'),
                  [IO.Path]::Combine($appRoot, 'node_modules', 'express', 'package.json')
                )
                foreach ($requiredPath in $requiredPaths) {
                  Write-Host "$requiredPath exists: $(Test-Path $requiredPath)"
                }
              } else {
                Write-Host '7-Zip extraction completed but resources/app/package.json was not located.'
              }
            } else {
              Write-Host '7-Zip could not inspect the portable SFX archive.'
            }
          } else {
            Write-Host '7-Zip is unavailable; skipping SFX inspection.'
          }

          $env:AURA_AUTOTEST = '1'
          $env:AURA_PORT = '5119'
          $env:SESSION_SECRET = 'ci-only-aura-windows-smoke-session-secret'
          $env:AURA_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP 'aura-runtime'
          New-Item -ItemType Directory -Force -Path $env:AURA_RUNTIME_DIR | Out-Null
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'aura-electron-stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'aura-electron-stderr.log'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--disable-gpu --enable-logging --v=1' -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          $healthy = $false
          try {
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5119/health' -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.service -eq 'integrated-system') {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }

            if (-not $healthy) {
              Write-Host 'Packaged app startup diagnostics:'
              Get-ChildItem -Path $env:AURA_RUNTIME_DIR -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host (Get-Content -Path $_.FullName -Raw)
              }
              Get-ChildItem -Path $env:APPDATA -Filter 'aura-electron-runtime.jsonl' -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host (Get-Content -Path $_.FullName -Raw)
              }
              Get-Content -Path $stdoutLog,$stderrLog -ErrorAction SilentlyContinue | Write-Host
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Aura|electron' } | Select-Object ProcessId,ParentProcessId,ExecutablePath,CommandLine | Format-List | Out-String | Write-Host
              throw 'Packaged Windows app did not start its local backend.'
            }

            $db = Invoke-RestMethod -Uri 'http://127.0.0.1:5119/api/db/status' -TimeoutSec 5
            if ($db.provider -ne 'sqlite-local') { throw "Expected isolated SQLite, got $($db.provider)." }

            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:5119/' -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'id="root"') {
              throw 'Packaged SPA did not serve the application shell.'
            }

            Write-Host 'Windows portable executable: backend, SQLite and SPA startup passed.'
          } finally {
            Get-Process -Name 'Aura System' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }
