name: Aura Observability Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript + build + observability contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit synchronized lockfile
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(ci): synchronize package lock"
            git push
          fi
      - run: npm run check
      - run: npm run test:session-store
      - run: npm run test:neon-session-store
      - run: npm run build
      - name: Build Windows desktop package
        run: npm run build:electron
      - name: Publish Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: aura-system-windows-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/verify-db-schema.mjs
      - run: node scripts/verify-observability.mjs
