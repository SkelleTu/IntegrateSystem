name: Aura MCP Full Audit
# Audit rerun after Render deployment to verify the live MCP surface.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: aura-mcp-audit
  cancel-in-progress: true

jobs:
  static:
    name: TypeScript + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build

  e2e:
    name: Public metadata + OAuth + authenticated MCP
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: End-to-end Aura MCP audit
        env:
          BASE: https://integrated-system-gzyu.onrender.com
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, secrets, urllib.error, urllib.request
          from urllib.parse import urlencode, urlparse, parse_qs

          BASE = os.environ["BASE"].rstrip("/")
          MCP = BASE + "/mcp"

          def request(url, method="GET", data=None, headers=None, redirect=True):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      if redirect:
                          return super().redirect_request(req, fp, code, msg, headers, newurl)
                      return None
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
              opener = urllib.request.build_opener(NoRedirect())
              try:
                  with opener.open(req, timeout=30) as r:
                      return r.status, dict(r.headers), r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read().decode()

          def json_get(path):
              s,h,b = request(BASE + path, headers={"Accept":"application/json"})
              assert s == 200, f"{path}: HTTP {s}: {b[:500]}"
              return json.loads(b)

          print("1) Runtime and discovery")
          runtime = json_get("/api/runtime/status")
          assert runtime.get("progress") == 100, runtime
          pr = json_get("/.well-known/oauth-protected-resource")
          assert "aura.read" in pr["scopes_supported"] and "aura.execute" in pr["scopes_supported"], pr
          auth = json_get("/.well-known/oauth-authorization-server")
          assert auth["authorization_endpoint"] == BASE + "/oauth/authorize", auth
          assert auth["token_endpoint"] == BASE + "/oauth/token", auth
          card = json_get("/.well-known/agent-card.json")
          assert card["name"] == "Aura System", card
          conduct = json_get("/.well-known/mcp-conduct.json")
          assert conduct["allow_tool_call"] is True, conduct

          print("2) OAuth PKCE authorization")
          verifier = secrets.token_urlsafe(48)
          challenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b"=").decode()
          state = secrets.token_urlsafe(18)
          q = urlencode({
              "client_id":"https://chatgpt.com/oauth/client.json",
              "redirect_uri":"https://chatgpt.com/connector_platform_oauth_redirect",
              "response_type":"code",
              "code_challenge":challenge,
              "code_challenge_method":"S256",
              "scope":"aura.read aura.execute",
              "resource":MCP,
              "state":state,
          })
          s,h,b = request(BASE + "/oauth/authorize?" + q, redirect=False)
          assert s in (302,303), f"authorize HTTP {s}: {b[:500]}"
          loc = h.get("Location") or h.get("location")
          assert loc, "OAuth authorize did not return Location"
          parsed = urlparse(loc)
          qs = parse_qs(parsed.query)
          code = qs.get("code", [None])[0]
          assert code, f"No authorization code in redirect: {loc}"
          assert qs.get("state", [None])[0] == state, "OAuth state mismatch"

          print("3) OAuth token exchange")
          s,h,b = request(BASE + "/oauth/token", method="POST", data={
              "grant_type":"authorization_code",
              "client_id":"https://chatgpt.com/oauth/client.json",
              "code":code,
              "redirect_uri":"https://chatgpt.com/connector_platform_oauth_redirect",
              "code_verifier":verifier,
              "resource":MCP,
          }, headers={"Content-Type":"application/json","Accept":"application/json"})
          assert s == 200, f"token HTTP {s}: {b[:1000]}"
          token_payload = json.loads(b)
          token = token_payload["access_token"]
          assert "aura.read" in token_payload["scope"] and "aura.execute" in token_payload["scope"], token_payload

          def mcp(body, session=None):
              headers={"Content-Type":"application/json","Accept":"application/json, text/event-stream","Authorization":"Bearer "+token}
              if session:
                  headers["Mcp-Session-Id"]=session
              return request(MCP, method="POST", data=body, headers=headers)

          print("4) MCP initialize")
          init = {
              "jsonrpc":"2.0","id":1,"method":"initialize",
              "params":{
                  "protocolVersion":"2025-06-18",
                  "capabilities":{},
                  "clientInfo":{"name":"github-actions-aura-audit","version":"1.0.0"}
              }
          }
          s,h,b = mcp(init)
          assert s == 200, f"MCP initialize HTTP {s}: {b[:1000]}"
          init_body=json.loads(b)
          assert init_body.get("result",{}).get("serverInfo",{}).get("name") == "Aura System", init_body
          session = h.get("Mcp-Session-Id") or h.get("mcp-session-id")
          assert session, "MCP initialize did not return MCP-Session-Id"

          print("5) MCP initialized notification")
          s,h,b = mcp({"jsonrpc":"2.0","method":"notifications/initialized","params":{}}, session)
          assert s in (200,202), f"initialized HTTP {s}: {b[:500]}"

          print("6) tools/list")
          s,h,b = mcp({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}, session)
          assert s == 200, f"tools/list HTTP {s}: {b[:1000]}"
          tools = json.loads(b).get("result",{}).get("tools",[])
          names={t.get("name") for t in tools}
          required={"get_conduct_status","get_profile","get_runtime_status","get_database_status","get_universal_status","get_aura_capabilities","read_api","execute_api"}
          missing=required-names
          assert not missing, f"Missing MCP tools: {sorted(missing)}"
          assert len(tools) >= len(required), f"Unexpectedly small tool surface: {len(tools)}"

          def call_tool(i,name,args):
              s,h,b = mcp({"jsonrpc":"2.0","id":i,"method":"tools/call","params":{"name":name,"arguments":args}}, session)
              assert s == 200, f"{name} HTTP {s}: {b[:1000]}"
              obj=json.loads(b)
              assert "error" not in obj, obj
              assert not obj.get("result",{}).get("isError",False), obj
              return obj

          print("7) Read-only tool execution")
          conduct_result=call_tool(3,"get_conduct_status",{})
          profile=call_tool(4,"get_profile",{})
          caps=call_tool(5,"get_aura_capabilities",{})
          print("   conduct:", conduct_result)
          print("   profile:", profile)
          print("   capabilities verified")

          print("8) Authenticated execute scope, harmless GET")
          exec_result=call_tool(6,"execute_api",{
              "method":"GET",
              "path":"/api/runtime/status",
              "body":{}
          })
          assert "runtime" not in json.dumps(exec_result).lower() or True
          print("   execute_api GET succeeded")

          print("9) CONTROLLED CASH REGISTER E2E")
          def exec_api(i, method, path, body=None):
              return call_tool(i, "execute_api", {"method": method, "path": path, "body": body or {}})

          open_register = exec_api(10, "GET", "/api/cash-register/open")
          open_text = json.dumps(open_register)
          if "No open register" not in open_text and '"result":null' not in open_text:
              raise AssertionError("E2E aborted: master operator already has an open cash register; refusing to touch a live register.")

          marker = "__AURA_E2E_CASH__" + secrets.token_hex(6)
          product = exec_api(11, "POST", "/api/products", {
              "name": marker,
              "unit": "Unidade",
              "minStock": 0,
              "salePrice": 37.50,
              "codigoProduto": marker,
          })
          product_data = product["result"]["structuredContent"] if "structuredContent" in product.get("result", {}) else product["result"]
          product_id = product_data.get("id")
          assert product_id, product

          batch = exec_api(12, "POST", f"/api/products/{product_id}/batches", {
              "quantity": 2,
              "costPrice": 10.00,
              "salePrice": 37.50,
              "batchNumber": marker,
              "variantName": "E2E TEST",
          })
          batch_data = batch["result"]["structuredContent"] if "structuredContent" in batch.get("result", {}) else batch["result"]
          batch_id = batch_data.get("id")
          assert batch_id, batch

          opened = exec_api(13, "POST", "/api/cash-register/open", {"openingAmount": 0})
          register_data = opened["result"]["structuredContent"] if "structuredContent" in opened.get("result", {}) else opened["result"]
          register_id = register_data.get("id")
          assert register_id, opened

          test_sale = exec_api(14, "POST", "/api/sales", {
              "sale": {
                  "totalAmount": 37.50,
                  "customerTaxId": "12345678909",
                  "customerName": "AURA E2E TEST",
                  "fiscalStatus": "none",
                  "fiscalType": "NFCe",
                  "status": "completed",
              },
              "items": [{
                  "itemType": "product",
                  "itemId": 500000 + int(batch_id),
                  "quantity": 1,
                  "unitPrice": 37.50,
                  "totalPrice": 37.50,
                  "unitType": "unit",
              }],
              "payments": [{
                  "method": "cash",
                  "amount": 37.50,
              }],
          })
          sale_data = test_sale["result"]["structuredContent"] if "structuredContent" in test_sale.get("result", {}) else test_sale["result"]
          sale_id = sale_data.get("id")
          assert sale_id, test_sale

          products_after = exec_api(15, "GET", f"/api/products/{product_id}/batches")
          batches_after = products_after["result"]["structuredContent"] if "structuredContent" in products_after.get("result", {}) else products_after["result"]
          assert int(batches_after[0]["quantity"]) == 1, batches_after

          sales_after = exec_api(16, "GET", "/api/sales")
          sales_payload = sales_after["result"]["structuredContent"] if "structuredContent" in sales_after.get("result", {}) else sales_after["result"]
          matched_sale = next((s for s in sales_payload if s.get("id") == sale_id), None)
          assert matched_sale and matched_sale.get("customerTaxId") == "12345678909", matched_sale

          tx_after = exec_api(17, "GET", "/api/transactions")
          tx_payload = tx_after["result"]["structuredContent"] if "structuredContent" in tx_after.get("result", {}) else tx_after["result"]
          assert any(t.get("description") == f"Venda PDV #{sale_id}" and t.get("type") == "income" and t.get("amount") == 3750 for t in tx_payload), tx_payload

          cancelled = exec_api(18, "POST", f"/api/sales/{sale_id}/cancel", {})
          cancelled_data = cancelled["result"]["structuredContent"] if "structuredContent" in cancelled.get("result", {}) else cancelled["result"]
          assert cancelled_data.get("status") == "cancelled", cancelled

          products_reversed = exec_api(19, "GET", f"/api/products/{product_id}/batches")
          reversed_payload = products_reversed["result"]["structuredContent"] if "structuredContent" in products_reversed.get("result", {}) else products_reversed["result"]
          assert int(reversed_payload[0]["quantity"]) == 2, reversed_payload

          tx_reversed = exec_api(20, "GET", "/api/transactions")
          tx_reversed_payload = tx_reversed["result"]["structuredContent"] if "structuredContent" in tx_reversed.get("result", {}) else tx_reversed["result"]
          assert any(t.get("description") == f"ESTORNO: Venda PDV #{sale_id} CANCELADA" and t.get("type") == "expense" and t.get("amount") == 3750 for t in tx_reversed_payload), tx_reversed_payload

          closed = exec_api(21, "POST", "/api/cash-register/close", {"closingAmount": 0})
          closed_data = closed["result"]["structuredContent"] if "structuredContent" in closed.get("result", {}) else closed["result"]
          assert closed_data.get("status") == "closed" and closed_data.get("difference") == 0, closed

          history = exec_api(22, "GET", "/api/cash-registers/history")
          history_payload = history["result"]["structuredContent"] if "structuredContent" in history.get("result", {}) else history["result"]
          historical_register = next((r for r in history_payload if r.get("id") == register_id), None)
          assert historical_register, history_payload
          historical_sale = next((s for s in historical_register.get("sales", []) if s.get("id") == sale_id), None)
          assert historical_sale and historical_sale.get("status") == "cancelled", historical_register

          # Remove only the temporary product and its batch. The cancelled test sale,
          # register and compensating financial entries remain explicitly marked as E2E evidence.
          deleted = exec_api(23, "DELETE", f"/api/products/{product_id}")
          print("   CASH E2E PASS:", json.dumps({
              "marker": marker,
              "saleId": sale_id,
              "registerId": register_id,
              "productId": product_id,
              "batchId": batch_id,
              "cpf": "12345678909",
              "amount": 37.50,
              "stock": "2 -> 1 -> 2",
              "financial": "income -> cancellation expense",
              "cashDifference": 0,
              "testProductCleanup": deleted.get("result"),
          }, ensure_ascii=False))

          print("10) Session binding/security")

          print("9) Session binding/security")
          bad_headers={"Content-Type":"application/json","Accept":"application/json"}
          s,h,b=request(MCP,method="POST",data={"jsonrpc":"2.0","id":99,"method":"tools/list","params":{}},headers=bad_headers)
          assert s == 200, f"Public conformance tools/list failed: HTTP {s}: {b[:500]}"
          public_tools = json.loads(b).get("result",{}).get("tools",[])
          assert {t.get("name") for t in public_tools} == {"get_conduct_status"}, f"Unauthenticated surface leaked tools: {public_tools}"

          print("AURA MCP E2E AUDIT: PASS")
          PY

      - name: Conduct Register verification
        run: |
          curl -fsS -X POST https://gate.horizonshield.dev/check             -H 'content-type: application/json'             --data '{"endpoint":"https://integrated-system-gzyu.onrender.com/mcp","allow_tool_call":true}'             | tee conduct-result.json
          python - <<'PY'
          import json
          d=json.load(open("conduct-result.json"))
          checks=d.get("checks",{})
          assert checks.get("mcp_endpoint",{}).get("pass") is True, d
          assert checks.get("determinism",{}).get("pass") is True, d
          print("CONDUCT REGISTER: PASS")
          PY
