name: Cash Register Forensic Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/storage.ts"
      - "server/db.ts"
      - "server/routes.ts"
      - "shared/schema.ts"
      - "client/src/pages/Cashier.tsx"
      - "client/src/pages/CashierClose.tsx"
      - "scripts/test-cash-register-flow.ts"
      - "scripts/test-cash-register-postgres.ts"
      - "scripts/verify-db-schema.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cash-register-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run check
      - name: Production build
        run: npm run build
      - name: SQLite/Turso schema parity
        run: node scripts/verify-db-schema.mjs
      - name: Cash register integration flow (SQLite)
        run: SQLITE_DB_PATH="/tmp/integratesystem-cash-register-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db" npm run test:cash-register
      - name: PostgreSQL/Neon runtime integration (when secret is configured)
        if: ${{ secrets.NEON_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SQLITE_DB_PATH: /tmp/integratesystem-postgres-test-local.db
        run: npm run test:cash-register:postgres
      - name: PostgreSQL integration test configuration warning
        if: ${{ secrets.NEON_DATABASE_URL == '' }}
        run: echo "::warning::NEON_DATABASE_URL is not configured; PostgreSQL runtime integration was not executed."
