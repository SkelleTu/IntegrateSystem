name: Forensic audit PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/forensic-pr-check.yml"

permissions:
  contents: read

concurrency:
  group: forensic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
